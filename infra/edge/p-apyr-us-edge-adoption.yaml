# Import template: the stack's resources plus the two reader resources being adopted (ReaderEdgeFunction and ReaderDistribution), exactly as live.
AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFront edge for p.apyr.us (CMS, marketing and reader) in front of Amplify default domains and the marketing bucket
Parameters:
  CertificateArn:
    Type: String
  ReaderCertificateArn:
    Type: String
  AmplifyAppId:
    Type: String
  ProductionHost:
    Type: String
    Default: p.apyr.us
  StagingHost:
    Type: String
    Default: p-staging.apyr.us
  ApexHost:
    Type: String
    Default: apyr.us
  ReaderHost:
    Type: String
    Default: read.p.apyr.us
Resources:
  ForwardHostFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-forward-host'
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect apex to production host; copy Host to x-forwarded-host
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host.value;
          if (host === '${ApexHost}') {
            var query = '';
            var keys = Object.keys(request.querystring);
            if (keys.length > 0) {
              query = '?' + keys.map(function (k) {
                var q = request.querystring[k];
                return q.value === '' ? k : k + '=' + q.value;
              }).join('&');
            }
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://${ProductionHost}' + request.uri + query } }
            };
          }
          request.headers['x-forwarded-host'] = { value: host };
          return request;
        }
  ReaderEdgeFunction:
    Type: AWS::CloudFront::Function
    DeletionPolicy: Retain
    Properties:
      Name: papyrus-reader-edge
      AutoPublish: true
      FunctionConfig:
        Comment: read.p.apyr.us publication only
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var host = request.headers.host.value;
          var keys = Object.keys(request.querystring);
          var query = '';
          if (keys.length > 0) {
            query = '?' + keys.map(function (k) {
              var q = request.querystring[k];
              return q.value === '' ? k : k + '=' + q.value;
            }).join('&');
          }
          function redirect(code, location) {
            return {
              statusCode: code,
              statusDescription: code === 301 ? 'Moved Permanently' : 'Found',
              headers: { location: { value: location } }
            };
          }
          if (uri === '/' || uri === '/index.html') {
            return redirect(302, 'https://read.p.apyr.us/information' + query);
          }
          if (uri === '/newsroom' || uri.indexOf('/newsroom/') === 0) {
            return redirect(302, 'https://p.apyr.us' + uri + query);
          }
          var publication = uri === '/information' || uri.indexOf('/information/') === 0 ||
            uri.indexOf('/_next/') === 0 || uri.indexOf('/api/') === 0 ||
            uri === '/feed.xml' || uri === '/rss.xml' || uri === '/atom.xml' || uri === '/sitemap.xml' ||
            uri === '/robots.txt' || uri === '/favicon.ico' || uri === '/papyrus-plant.png' ||
            uri.indexOf('/.well-known/') === 0;
          if (!publication) {
            return redirect(302, 'https://read.p.apyr.us/information' + query);
          }
          request.headers['x-forwarded-host'] = { value: host };
          return request;
        }
  ProductionDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: p.apyr.us production
        HttpVersion: http2and3
        IPV6Enabled: true
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: amplify
            DomainName: !Sub 'main.${AmplifyAppId}.amplifyapp.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: amplify
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ForwardHostFunction.FunctionARN
  StagingDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: p-staging.apyr.us staging
        Aliases: [!Ref StagingHost]
        HttpVersion: http2and3
        IPV6Enabled: true
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: amplify
            DomainName: !Sub 'staging.${AmplifyAppId}.amplifyapp.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: amplify
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ForwardHostFunction.FunctionARN
  ReaderDistribution:
    Type: AWS::CloudFront::Distribution
    DeletionPolicy: Retain
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: read.p.apyr.us reader
        Aliases: [!Ref ReaderHost]
        HttpVersion: http2and3
        IPV6Enabled: true
        ViewerCertificate:
          AcmCertificateArn: !Ref ReaderCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: amplify
            DomainName: !Sub 'main.${AmplifyAppId}.amplifyapp.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: amplify
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: arn:aws:cloudfront::712236451410:function/papyrus-reader-edge
Outputs:
  ProductionDistributionId:
    Value: !Ref ProductionDistribution
  ProductionDomainName:
    Value: !GetAtt ProductionDistribution.DomainName
  StagingDistributionId:
    Value: !Ref StagingDistribution
  StagingDomainName:
    Value: !GetAtt StagingDistribution.DomainName
